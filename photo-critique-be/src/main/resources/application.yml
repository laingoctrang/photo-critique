spring:
  application:
    name: photo-critique-app
  messages:
    basename: lang/messages
    encoding: UTF-8

  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true

    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      username: ${REDIS_USERNAME:default}
      database: ${REDIS_DATABASE:0}
      timeout: 5000
      jedis:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 1
          max-wait: 3000ms
      ssl:
        enabled: false

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    from: ${SMTP_FROM}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        debug: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

logging:
  level:
    com.photo_critique_be: INFO
    org.springframework.data.mongodb.core: INFO
    org.springframework.data.redis: INFO
    org.springframework.mail: DEBUG

cloudinary:
  cloud-name: ${CLOUD_NAME}
  api-key: ${API_KEY}
  api-secret: ${API_SECRET}

app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  upload:
    max-file-size: ${MAX_FILE_SIZE:26214400}  # Default: 25MB (25 * 1024 * 1024 bytes)

  jwt:
    access:
      secret: ${JWT_ACCESS_SECRET}
      expire: ${JWT_ACCESS_EXPIRE:86400000}
    reset:
      secret: ${JWT_RESET_SECRET}
      expire: ${JWT_RESET_EXPIRE:600000}

  otp:
    destination:
      default: EMAIL
    expire-time:
      default: 300    # 5 minutes for general OTP
      forgot-password: 900  # 15 minutes for forgot password
    length: 4

  security:
    cors:
      allowed-origins: "${app.frontend-url},${app.base-url}"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"
      allow-credentials: true
    oauth2:
      google:
        client-id: ${GOOGLE_APP_ID}
        client-secret: ${GOOGLE_APP_SECRET}
        authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
        token-uri: https://oauth2.googleapis.com/token
        redirect-uri: "${app.base-url}/api/oauth/callback/google"
        user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
        scope: openid https://www.googleapis.com/auth/userinfo.profile https://www.googleapis.com/auth/userinfo.email

      facebook:
        client-id: ${FACEBOOK_APP_ID}
        client-secret: ${FACEBOOK_APP_SECRET}
        authorization-uri: https://www.facebook.com/v10.0/dialog/oauth
        token-uri: https://graph.facebook.com/v10.0/oauth/access_token
        redirect-uri: "${app.base-url}/api/oauth/callback/facebook"
        user-info-uri: https://graph.facebook.com/me?fields=id,name,email,picture
        scope: public_profile, email